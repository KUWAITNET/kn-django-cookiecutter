# --- Approved: add when the project needs it ---------------------------------

[[packages]]
name = "django-import-export"
tier = "approved"
trigger = "The client needs to bulk-load or export data themselves, in Excel or CSV."
reason = "Integrates with Unfold. Check its declared Django support before adding."

[[packages]]
name = "django-allauth"
tier = "approved"
trigger = "The project has end-user accounts - registration, log-in, password reset, social sign-in."
reason = "The template deliberately has no end-user auth story. This is it, not a hand-rolled registration view."

[[packages]]
name = "dj-rest-auth"
tier = "approved"
trigger = "The same project also exposes those accounts over the API."
reason = "Use with django-allauth, never instead of it. One JWT configuration per project."

[[packages]]
name = "ottu-py"
tier = "approved"
trigger = "The project takes payments through Ottu."
reason = "Install the base package, not the [django] extra - the extra pins django<4.3."

[[packages]]
name = "django-anymail"
tier = "approved"
trigger = "SMTP deliverability is not good enough, or the volume needs bounce and complaint webhooks."
reason = "Sits behind django-post-office, which stays the outbound path so every send is still logged."

[[packages]]
name = "mypy"
tier = "approved"
trigger = "A long-lived project with a substantial service layer, typed from the start and run in CI."
reason = "Adding type checking to a large untyped codebase mid-project is worse than not having it."

[[packages]]
name = "django-stubs"
tier = "approved"
trigger = "Paired with mypy."
reason = "Django type stubs; useless without mypy and never added alone."

[[packages]]
name = "django-crispy-forms"
tier = "approved"
trigger = "More than a handful of server-rendered forms, and the design is Bootstrap 5."
reason = "Always with crispy-bootstrap5 - the template pack is what does the rendering."

[[packages]]
name = "crispy-bootstrap5"
tier = "approved"
trigger = "Paired with django-crispy-forms."
reason = "The Bootstrap 5 template pack. Never one without the other."

[[packages]]
name = "weasyprint"
tier = "approved"
trigger = "The project generates PDFs - invoices, certificates, reports."
reason = "Renders HTML and CSS, so a PDF is a reviewable template. Needs pango and cairo, so it changes the Dockerfile."

# --- Rejected, and why -------------------------------------------------------

[[packages]]
name = "django-braces"
tier = "rejected"
reason = "Declares Django 2.2-4.2, installs anyway on a Django it has never seen, and fails later at runtime. What it is reached for has been in django.contrib.auth.mixins since Django 1.9."

[[packages]]
name = "django-model-utils"
tier = "rejected"
reason = "Duplicates apps.core.models.TimeStampedModel, and declares support only to Django 5.1. Write StatusField and MonitorField yourself; they are a TextChoices and a DateTimeField."

[[packages]]
name = "django-redis"
tier = "rejected"
reason = "Django 4.0 put RedisCache in core, and it does everything we use a cache for. One less dependency, maintained by the framework authors, is the better trade."

[[packages]]
name = "django-celery-beat"
tier = "rejected"
reason = "Pins Django<6.1, and a schedule in database rows exists on one server, appears in no code review, and is lost with the machine."

[[packages]]
name = "django-split-settings"
tier = "rejected"
reason = "The base/dev/production/test settings package already does this, in plain Python imports a new developer can read without learning a library."

[[packages]]
name = "easy-thumbnails"
tier = "rejected"
reason = "Duplication, not health: this project already re-encodes every uploaded image server-side, so bound the dimensions there. On-the-fly thumbnailing adds a cache to back up, invalidate and get wrong."

[[packages]]
name = "sorl-thumbnail"
tier = "rejected"
reason = "Same reason as easy-thumbnails: resize on upload instead, so the bytes on disk are the bytes you serve."

[[packages]]
name = "drf-recaptcha"
tier = "rejected"
reason = "Cloudflare Turnstile is the fixed company decision and ships with a honeypot behind it. Two bot-protection systems means two sets of keys and one of them silently unmaintained."

[[packages]]
name = "django-ckeditor"
tier = "rejected"
reason = "Bundles CKEditor 4, which is end-of-life and has published XSS vulnerabilities. A rich-text editor is an XSS surface by construction; shipping an unsupported one is not a trade-off we make."
