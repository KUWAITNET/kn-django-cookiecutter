# The KUWAITNET approved-package list, shipped with the project.
#
# A copy rather than a fetch, deliberately: `tools/check_standards.py` has to run
# in a pre-commit hook on a train and in a CI container with no outbound network,
# and a check that silently passes when it cannot reach the internet is worse
# than no check. Point the script at a newer copy with --packages when you need
# one.
#
# The canonical source, with the full reasoning behind every entry, is
# `approved-packages.toml` and `docs/approved-packages.md` in
# https://bitbucket.org/KuwaitNET/kn-docs - a test there asserts the
# two agree. The reasons below are trimmed to one line; read the document before
# arguing with one.
#
# Tiers:
#   shipped   - already in this project. Use it; do not re-litigate it.
#   approved  - decided in advance, added when its trigger fires. No call needed.
#   rejected  - decided against, with the reason. The checker fails the build.
#
# A package in no tier is UNDECIDED, not forbidden. The checker warns rather than
# fails, because the answer is a twenty-minute review and a pull request against
# the standards, not a workaround here.

[meta]
source = "https://bitbucket.org/KuwaitNET/kn-docs"
document = "docs/approved-packages.md"
updated = "2026-11-03"

