# Install with: make setup  (or: uv run pre-commit install)
# Run over everything: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "apps", "{{ cookiecutter.project_slug }}"]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  # The KUWAITNET rules no linter has a rule for: serializers that publish every
  # column, upload fields with no validators, unexplained csrf_exempt, committed
  # secrets, rejected dependencies. Stdlib only, so there is nothing to install.
  # Whole-project by design - a violation is a violation whether or not this
  # commit touched the file.
  - repo: local
    hooks:
      - id: kuwaitnet-standards
        name: KUWAITNET standards
        entry: uv run python tools/check_standards.py
        language: system
        pass_filenames: false
        always_run: true
